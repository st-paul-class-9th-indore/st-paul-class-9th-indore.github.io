
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional 3D Classroom - Rotating Seating</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f172a;
}

#info {
    position: fixed;
    z-index: 10;
    top: 16px;
    left: 16px;
    padding: 14px 18px;
    color: #f8fafc;
    background: rgba(30, 41, 59, 0.9);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
}

#info b {
    font-size: 18px;
    letter-spacing: 0.5px;
}

#date {
    margin-top: 6px;
    font-size: 13px;
    color: #94a3b8;
}

#reset {
    position: fixed;
    z-index: 10;
    right: 16px;
    top: 16px;
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    background: #3b82f6;
    color: white;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    transition: background 0.2s;
}

#reset:hover {
    background: #2563eb;
}

/* Modal Popup Card */
#modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(30, 41, 59, 0.98);
    color: #f8fafc;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    z-index: 100;
    width: 320px;
    display: none;
    opacity: 0;
    transition: all 0.25s ease-in-out;
    border: 1px solid rgba(255,255,255,0.15);
}

#modal.active {
    display: block;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

#modal h3 {
    margin-top: 0;
    font-size: 20px;
    color: #60a5fa;
    border-bottom: 1px solid #475569;
    padding-bottom: 10px;
}

#modal p {
    margin: 12px 0;
    font-size: 14px;
    color: #cbd5e1;
    line-height: 1.5;
}

#modal button {
    margin-top: 16px;
    background: #ef4444;
    border: none;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    width: 100%;
    transition: background 0.2s;
}

#modal button:hover {
    background: #dc2626;
}

.instructions {
    position: fixed;
    bottom: 16px;
    left: 16px;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(4px);
    color: #94a3b8;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    pointer-events: none;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.05);
}
</style>

<!-- Load Three.js and OrbitControls via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>

<div id="info">
    <b>Professional 3D Classroom (Rotating Seats)</b>
    <div id="date"></div>
</div>

<button id="reset">Reset View</button>
<div class="instructions">Click any desk to check daily rotated student allocation</div>

<!-- Interactive Modal -->
<div id="modal">
    <h3 id="modalTitle">Desk Info</h3>
    <p id="modalDesc">Details will appear here.</p>
    <button id="closeModal">Close</button>
</div>

<script>
const START_DATE = new Date("2026-04-01");

/* =========================================================
   SCENE SETUP
========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e293b);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(18, 16, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 6;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.48;

/* =========================================================
   LIGHTING
========================================================= */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
dirLight.position.set(-12, 22, 12);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -24;
dirLight.shadow.camera.right = 24;
dirLight.shadow.camera.top = 24;
dirLight.shadow.camera.bottom = -24;
scene.add(dirLight);

/* =========================================================
   MATERIALS
========================================================= */
const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x9a3412, roughness: 0.5 });
const woodDarkMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.6 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4, roughness: 0.1 });
const boardFrameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
const smartScreenMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, emissive: 0x0369a1, emissiveIntensity: 0.5 });
const blackBoardMat = new THREE.MeshStandardMaterial({ color: 0x064e3b, roughness: 0.8 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.7 });

/* =========================================================
   ROOM GEOMETRY
========================================================= */
const ROOM_W = 30;
const ROOM_D = 24;
const WALL_H = 8;

const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.4, ROOM_D), floorMat);
floor.position.y = -0.2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(ROOM_W, 30, 0x475569, 0x334155);
grid.position.y = 0.01;
scene.add(grid);

// Walls
const backWall = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, WALL_H, 0.4), wallMat);
backWall.position.set(0, WALL_H / 2, -ROOM_D / 2);
scene.add(backWall);

const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, WALL_H, ROOM_D), wallMat);
leftWall.position.set(-ROOM_W / 2, WALL_H / 2, 0);
scene.add(leftWall);

const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, WALL_H, ROOM_D), wallMat);
rightWall.position.set(ROOM_W / 2, WALL_H / 2, 0);
scene.add(rightWall);

/* =========================================================
   BOARDS (Smartboard + Blackboard on Front Wall)
========================================================= */
function createBoards() {
    // Smartboard (Center-Left)
    const sbGroup = new THREE.Group();
    sbGroup.position.set(-3.2, 4.5, -ROOM_D / 2 + 0.22);
    scene.add(sbGroup);

    const sbFrame = new THREE.Mesh(new THREE.BoxGeometry(7.5, 3.6, 0.25), boardFrameMat);
    sbGroup.add(sbFrame);
    const sbScreen = new THREE.Mesh(new THREE.BoxGeometry(6.9, 3.0, 0.08), smartScreenMat);
    sbScreen.position.z = 0.12;
    sbGroup.add(sbScreen);

    // Blackboard (Center-Right)
    const bbGroup = new THREE.Group();
    bbGroup.position.set(5.0, 4.5, -ROOM_D / 2 + 0.22);
    scene.add(bbGroup);

    const bbFrame = new THREE.Mesh(new THREE.BoxGeometry(7.5, 3.6, 0.25), boardFrameMat);
    bbGroup.add(bbFrame);
    const bbScreen = new THREE.Mesh(new THREE.BoxGeometry(6.9, 3.0, 0.08), blackBoardMat);
    bbScreen.position.z = 0.12;
    bbGroup.add(bbScreen);
}
createBoards();

/* =========================================================
   DOORS ON RIGHT WALL (Top-Right & Back-Right)
========================================================= */
function createDoor(zPos) {
    const doorGroup = new THREE.Group();
    doorGroup.position.set(ROOM_W / 2 - 0.22, 2.7, zPos);
    doorGroup.rotation.y = -Math.PI / 2;
    scene.add(doorGroup);

    const frame = new THREE.Mesh(new THREE.BoxGeometry(2.8, 5.5, 0.3), woodDarkMat);
    doorGroup.add(frame);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(2.5, 5.2, 0.15), doorMat);
    panel.position.z = 0.05;
    doorGroup.add(panel);
}
createDoor(-6.0); // Top-Right Door (Front side)
createDoor(6.0);  // Back-Right Door

/* =========================================================
   WINDOWS ON LEFT WALL
========================================================= */
function createWindow(zPos) {
    const wGroup = new THREE.Group();
    wGroup.position.set(-ROOM_W / 2 + 0.22, 4.2, zPos);
    wGroup.rotation.y = Math.PI / 2;
    scene.add(wGroup);

    const frame = new THREE.Mesh(new THREE.BoxGeometry(4.2, 3.0, 0.3), woodDarkMat);
    wGroup.add(frame);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.6, 0.08), glassMat);
    glass.position.z = 0.1;
    wGroup.add(glass);
}
createWindow(-5.0);
createWindow(5.0);

/* =========================================================
   TEXT LABELS FOR DESKS
========================================================= */
function createDeskNumberTexture(number) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`Desk ${number}`, 64, 32);

    const texture = new THREE.CanvasTexture(canvas);
    return new THREE.MeshBasicMaterial({ map: texture });
}

/* =========================================================
   DESK & SEAT CREATION
========================================================= */
const interactiveObjects = [];

function createDesk(student1, student2, deskNumber) {
    const group = new THREE.Group();
    group.userData = { deskNumber, student1, student2 };

    const topMat = [
        woodMat, woodMat,
        createDeskNumberTexture(deskNumber), woodMat,
        woodMat, woodMat
    ];
    const top = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.18, 1.4), topMat);
    top.position.y = 2.1;
    top.castShadow = true;
    top.receiveShadow = true;
    group.add(top);

    [[-1.15, -0.5], [1.15, -0.5], [-1.15, 0.5], [1.15, 0.5]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.1, 0.12), metalMat);
        leg.position.set(x, 1.05, z);
        leg.castShadow = true;
        group.add(leg);
    });

    createChair(group, -0.75);
    createChair(group, 0.75);

    group.traverse(child => {
        child.userData = group.userData;
        interactiveObjects.push(child);
    });

    return group;
}

function createChair(parent, x) {
    const seat = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.15, 0.8), woodMat);
    seat.position.set(x, 0.95, 0.9);
    seat.castShadow = true;
    parent.add(seat);

    const back = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 0.12), woodMat);
    back.position.set(x, 1.45, 1.25);
    back.castShadow = true;
    parent.add(back);

    [[-0.42, 0.9], [0.42, 0.9]].forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.95, 0.08), metalMat);
        leg.position.set(x + lx, 0.475, lz);
        leg.castShadow = true;
        parent.add(leg);
    });
}

/* =========================================================
   ROTATING SEATING LOGIC (EXCLUDING SUNDAYS)
========================================================= */
const students = Array.from({ length: 41 }, (_, i) => i + 1);

function workingDaysSinceStart(date) {
    const start = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
    const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    if (target <= start) return 0;

    let days = 0;
    const current = new Date(start);
    while (current < target) {
        current.setDate(current.getDate() + 1);
        if (current.getDay() !== 0) days++; // Skip Sundays
    }
    return days;
}

function getSeating(date) {
    const days = workingDaysSinceStart(date);
    const shift = (days * 2) % 48; // Shift rotation daily
    const result = new Array(48).fill(null);

    for (let newPos = 0; newPos < 48; newPos++) {
        const oldPos = (newPos - shift + 48) % 48;
        if (oldPos < 41) {
            result[newPos] = students[oldPos];
        }
    }
    return result;
}

function buildClassroom() {
    const today = new Date();
    const seating = getSeating(today);

    // 4 Columns, 6 Desks each with wide gaps
    const startX = -5.4;
    const gapX = 3.6;
    const startZ = -6.0;
    const gapZ = 3.1; // Increased gap between desk rows

    for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 4; col++) {
            const deskNumber = row * 4 + col + 1;
            const student1 = seating[(deskNumber - 1) * 2];
            const student2 = seating[(deskNumber - 1) * 2 + 1];

            const desk = createDesk(student1, student2, deskNumber);
            desk.position.set(startX + col * gapX, 0, startZ + row * gapZ);
            scene.add(desk);
        }
    }

    const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    const isSunday = today.getDay() === 0;
    document.getElementById('date').textContent = today.toLocaleDateString('en-IN', options) + 
        (isSunday ? " (Sunday - Holiday, Rotation Paused)" : " (Active Rotating Seating Day)");
}
buildClassroom();

/* =========================================================
   INTERACTION / RAYCASTING
========================================================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('click', (event) => {
    if (event.clientY < 65 || (event.clientX > window.innerWidth - 130 && event.clientY < 65)) return;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(interactiveObjects, true);

    if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData?.deskNumber) {
            obj = obj.parent;
        }
        if (obj && obj.userData) {
            showModal(obj.userData);
        }
    }
});

function showModal(data) {
    const modal = document.getElementById('modal');
    const row = Math.floor((data.deskNumber - 1) / 4) + 1;
    const col = ((data.deskNumber - 1) % 4) + 1;

    document.getElementById('modalTitle').textContent = `Desk #${data.deskNumber}`;
    document.getElementById('modalDesc').innerHTML = `
        <b>Grid Location:</b> Row ${row}, Column ${col}<br>
        <b>Left Seat Assigned:</b> ${data.student1 !== null ? 'Student #' + data.student1 : 'Empty Seat'}<br>
        <b>Right Seat Assigned:</b> ${data.student2 !== null ? 'Student #' + data.student2 : 'Empty Seat'}
    `;
    modal.classList.add('active');
}

document.getElementById('closeModal').addEventListener('click', () => {
    document.getElementById('modal').classList.remove('active');
});

document.getElementById('reset').addEventListener('click', () => {
    camera.position.set(18, 16, 24);
    controls.target.set(0, 2, 0);
    controls.update();
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   RENDER LOOP
========================================================= */
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
